# Managed by the local dev control plane: /Users/dmitriystokaz/Claude/local-dev
# Static site (index/donut/combo/waterfall/scatter) — served read-only by a
# stock Caddy server using Caddyfile.dev (adds no-cache so shared.js/css edits
# are never served stale). No Dockerfile needed.
# Start/stop with: dev start donut-builder / dev stop donut-builder
name: donut-builder

services:
  donut-builder:
    image: caddy:2
    container_name: donut-builder
    ports:
      - "3007:80"
    volumes:
      - .:/srv:ro
    command: ["caddy", "run", "--config", "/srv/Caddyfile.dev", "--adapter", "caddyfile"]
