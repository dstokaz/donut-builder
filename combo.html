<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combo Chart Builder</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>

<div id="panel">
  <div id="panel-inner">

    <div class="section">
      <div class="panel-title">Title</div>
      <div class="field-row">
        <div class="field-label-row">
          <div class="field-label">Chart title</div>
          <button class="vis-toggle" id="toggleTitle" title="Show/hide">●</button>
        </div>
        <input type="text" id="comboTitle" placeholder="Chart title">
      </div>
    </div>

    <div class="section">
      <div class="panel-title">Categories (X axis)</div>
      <div id="cat-list"></div>
      <button id="add-cat" class="btn-add">+ Add category</button>
    </div>

    <div class="section">
      <div class="panel-title">Series</div>
      <div id="series-list"></div>
      <button id="add-series" class="btn-add">+ Add series</button>
    </div>

    <div class="section">
      <div class="panel-title">Values</div>
      <div class="matrix-wrap"><div id="matrix"></div></div>
    </div>

    <div class="section">
      <div class="panel-title">Axis</div>
      <div class="toggle-row">
        <span class="field-label">Dual axis (left + right)</span>
        <button class="vis-toggle" id="toggleDual" title="Single / dual axis">●</button>
      </div>
    </div>

    <div class="section">
      <div class="panel-title">Display</div>
      <div class="toggle-row">
        <span class="field-label">Grid lines</span>
        <button class="vis-toggle" id="toggleGrid" title="Show/hide">●</button>
      </div>
      <div class="toggle-row">
        <span class="field-label">Legend</span>
        <button class="vis-toggle" id="toggleLegend" title="Show/hide">●</button>
      </div>
      <div class="field-stack" id="legendPosRow">
        <span class="field-label">Legend position</span>
        <div id="legendPosCtl"></div>
      </div>
      <div class="field-stack">
        <span class="field-label">Aspect ratio</span>
        <div id="aspectCtl"></div>
      </div>
      <div id="display-sliders"></div>
    </div>

    <div class="section">
      <div class="panel-title">Background</div>
      <div class="bg-row">
        <div class="bg-swatch" id="bgSwatch">
          <input type="color" id="bgColorPicker" value="#111111">
        </div>
        <input type="text" id="bgColorHex" value="#111111" placeholder="#111111">
      </div>
    </div>

    <div class="section">
      <div class="panel-title">Import</div>
      <button id="toggleImport" class="btn-add">Import JSON…</button>
      <div id="import-panel" hidden>
        <textarea id="importText" class="import-textarea" spellcheck="false"
          placeholder='{
  "categories": ["Q1", "Q2", "Q3", "Q4"],
  "series": [
    { "name": "Revenue", "values": [120, 150, 170, 140] },
    { "name": "Profit",  "values": [40, 55, 60, 52] }
  ]
}'></textarea>
        <div class="import-hint">Accepts plain data, or a full config exported below
          (colors, sizes, background, layout).</div>
        <div id="importMsg" class="import-msg"></div>
        <div class="export-btns">
          <button class="btn-export primary" id="applyImport">Apply</button>
          <button class="btn-export" id="cancelImport">Cancel</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="panel-title">Export</div>
      <div class="export-btns">
        <button class="btn-export primary" onclick="exportChart(true)">Export PNG</button>
        <button class="btn-export" onclick="exportChart(false)">Export PNG (transparent)</button>
        <button class="btn-export" onclick="exportJSON()">Export JSON (data + config)</button>
      </div>
    </div>

  </div>
</div>

<div id="preview">
  <nav class="chart-tabs">
    <a class="chart-tab home" href="index.html" aria-label="All charts" title="All charts">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>
      </svg>
    </a>
    <a class="chart-tab" href="donut.html">Donut</a>
    <a class="chart-tab active" href="combo.html">Combo</a>
  </nav>
  <canvas id="canvas"></canvas>
</div>

<script src="shared.js"></script>
<script>
// ── State ──────────────────────────────────────────────────────────────────
let nextId = 1;

function mkSeries(name, color, kind, axis, values, showLabels = false, prefix = '', suffix = '') {
  return { id: nextId++, name, color, kind, axis, showLabels, prefix, suffix, values: values.slice() };
}

const state = {
  title: 'Revenue & Growth',
  showTitle: true,
  categories: ['Q1', 'Q2', 'Q3', 'Q4'],
  series: [],
  dualAxis: true,
  showGrid: true,
  showLegend: true,
  legendPos: 'top',     // 'top' | 'bottom' | 'left' | 'right'
  aspect: '16:9',       // '16:9' | '3:2' | '4:3' | '1:1'
  bgColor: '#111111',
  barWidth: 0.7,        // fraction of a category slot used by the bar group
  barGap: 0.12,         // gap between adjacent bars in a group, as a fraction of one bar's width
  lineWidth: 3,         // px
  axisFontSize: 14,     // px
  valueFontSize: 11,    // px
  legendFontSize: 14,   // px
};

state.series = [
  mkSeries('Revenue',  '#2A7AFF', 'bar',  'left',  [120, 150, 170, 140], true),
  mkSeries('Growth %', '#E84545', 'line', 'right', [10, 18, 12, 22], false, '', '%'),
];

// Effective axis honoring the dual-axis toggle (single axis => everything left).
function effAxis(s) { return state.dualAxis ? s.axis : 'left'; }

function axisMaxFor(list) {
  let max = 0;
  for (const s of list)
    for (const v of s.values) {
      const n = Number(v);
      if (isFinite(n) && n > max) max = n;
    }
  return niceMax(max);
}

function fmtNum(n) {
  if (!isFinite(n)) return '';
  if (Number.isInteger(n)) return n.toLocaleString();
  return (Math.round(n * 10) / 10).toLocaleString();
}

// Draw a value label as a rounded "pill" tinted with the series color, centered on
// `cx` with its bottom edge at `bottomY`. Keeps labels readable over bars/grid/bg.
function drawValueLabel(c, text, cx, bottomY, color) {
  const fs = state.valueFontSize;
  c.font = `600 ${fs}px ${FF}`;
  const padX = 6, padY = 3;
  const w = c.measureText(text).width + padX * 2;
  const h = fs + padY * 2;
  const x = cx - w / 2;
  const y = bottomY - h;
  const r = Math.min(6, h / 2);
  c.beginPath();
  c.roundRect(x, y, w, h, r);
  c.fillStyle = hexToRgba(color, 0.22);
  c.fill();
  c.fillStyle = '#f0f0f0';
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(text, cx, y + h / 2);
}

// Break `text` into lines that each fit within `maxW` px under the current
// c.font. Wraps on spaces; hard-breaks any single word wider than maxW. Caps at
// `maxLines` lines, appending an ellipsis if content remains. Always returns ≥1 line.
function wrapLabel(c, text, maxW, maxLines = 3) {
  const fits = s => c.measureText(s).width <= maxW;
  // Split words; hard-break any word that can't fit on its own line.
  const words = [];
  text.split(/\s+/).filter(Boolean).forEach(word => {
    if (fits(word)) { words.push(word); return; }
    let chunk = '';
    for (const ch of word) {
      if (chunk && !fits(chunk + ch)) { words.push(chunk); chunk = ''; }
      chunk += ch;
    }
    if (chunk) words.push(chunk);
  });
  if (!words.length) return [text];

  const lines = [];
  let line = '';
  for (const word of words) {
    const next = line ? line + ' ' + word : word;
    if (line && !fits(next)) { lines.push(line); line = word; }
    else line = next;
  }
  if (line) lines.push(line);

  if (lines.length <= maxLines) return lines;
  // Truncate to maxLines, ellipsizing the last visible line.
  const kept = lines.slice(0, maxLines);
  let last = kept[maxLines - 1];
  while (last && !fits(last + '…')) last = last.slice(0, -1);
  kept[maxLines - 1] = last + '…';
  return kept;
}

// ── Canvas Rendering ────────────────────────────────────────────────────────
// Canvas pixel size per aspect ratio (width is the long side, kept ~1040 so the
// chart stays crisp; height follows the ratio). 1:1 is shrunk to fit the viewport.
const ASPECTS = {
  '21:9': [1040, 446],   // ultrawide / cinematic
  '16:9': [1040, 585],
  '3:2':  [1040, 693],
  '4:3':  [1040, 780],
  '1:1':  [820, 820],
};
let [CANVAS_W, CANVAS_H] = ASPECTS[state.aspect] || ASPECTS['16:9'];
const FF = "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
const TICKS = 5;

const canvas = document.getElementById('canvas');
let ctx      = setupCanvas(canvas, CANVAS_W, CANVAS_H);

// Switch aspect ratio: resize the canvas backing store and repaint.
function setAspect(a) {
  if (!ASPECTS[a]) return;
  state.aspect = a;
  [CANVAS_W, CANVAS_H] = ASPECTS[a];
  ctx = setupCanvas(canvas, CANVAS_W, CANVAS_H);
  renderPreview();
}

function render(c, w, h, withBg) {
  c.clearRect(0, 0, w, h);
  if (withBg) { c.fillStyle = state.bgColor; c.fillRect(0, 0, w, h); }

  const cats = state.categories;
  if (!cats.length || !state.series.length) return;

  const leftList  = state.series.filter(s => effAxis(s) === 'left');
  const rightList = state.series.filter(s => effAxis(s) === 'right');
  const hasRight  = state.dualAxis && rightList.length > 0;

  const leftMax  = axisMaxFor(leftList);
  const rightMax = axisMaxFor(rightList);

  // Legend metrics (computed up front so the plot can reserve space for it).
  const lf = state.legendFontSize;
  const legendOn = state.showLegend && state.series.length > 0;
  const legPos = state.legendPos || 'top';
  const glyphW = 18, glyphGap = 7, itemGapX = 22;
  let legItemW = [], legBandH = 0, legBandW = 0;
  if (legendOn) {
    c.font = `500 ${lf}px ${FF}`;
    legItemW = state.series.map(s => glyphW + glyphGap + c.measureText(s.name || 'Series').width);
    legBandH = Math.round(lf * 1.5) + 12;          // height of a top/bottom legend row
    legBandW = Math.max(...legItemW) + 28;         // width of a left/right legend column
  }

  // Plot rectangle — reserve space on whichever side holds the legend; the
  // bottom strip also grows with the number of wrapped X-axis label lines.
  let top = 28;
  if (state.showTitle && state.title) top += 34;
  if (legendOn && legPos === 'top') top += legBandH;
  const plotTop   = top;
  let plotLeft    = 72;
  let plotRight   = w - (hasRight ? 72 : 32);
  if (legendOn && legPos === 'left')  plotLeft  += legBandW;
  if (legendOn && legPos === 'right') plotRight -= legBandW;
  const plotW = plotRight - plotLeft;
  if (plotW <= 0) return;

  // Wrap X-axis category labels to slot width; reserve a bottom strip tall
  // enough for the tallest wrapped label (min matches the original single-line gap).
  const af = state.axisFontSize;
  const slotW = plotW / cats.length;
  const lineHeight = Math.round(af * 1.25);
  c.font = `500 ${af}px ${FF}`;
  const wrappedLabels = cats.map(cat => wrapLabel(c, String(cat), slotW - 8));
  const maxLines = Math.max(1, ...wrappedLabels.map(l => l.length));
  let bottomPad = Math.max(58, 12 + maxLines * lineHeight + 8);
  if (legendOn && legPos === 'bottom') bottomPad += legBandH;
  const plotBottom = h - bottomPad;
  const plotH = plotBottom - plotTop;
  if (plotH <= 0) return;

  // Title
  if (state.showTitle && state.title) {
    c.font = `600 22px ${FF}`;
    c.fillStyle = '#e8e8e8';
    c.textAlign = 'center';
    c.textBaseline = 'alphabetic';
    c.fillText(state.title, w / 2, 40);
  }

  // Legend — placed on the side chosen via state.legendPos.
  if (legendOn) {
    c.font = `500 ${lf}px ${FF}`;
    c.textBaseline = 'middle';
    const drawItem = (s, gx, cy) => {
      if (s.kind === 'bar') {
        c.fillStyle = s.color;
        c.fillRect(gx, cy - 6, glyphW, 12);
      } else {
        c.strokeStyle = s.color;
        c.lineWidth = 3;
        c.beginPath(); c.moveTo(gx, cy); c.lineTo(gx + glyphW, cy); c.stroke();
        c.beginPath(); c.arc(gx + glyphW / 2, cy, 3, 0, Math.PI * 2); c.fillStyle = s.color; c.fill();
      }
      c.fillStyle = '#cfcfcf';
      c.textAlign = 'left';
      c.fillText(s.name || 'Series', gx + glyphW + glyphGap, cy);
    };

    if (legPos === 'left' || legPos === 'right') {
      // Vertical stack, centered on the plot's vertical span.
      const itemH = Math.round(lf * 1.7);
      const blockH = state.series.length * itemH;
      let cy = plotTop + plotH / 2 - blockH / 2 + itemH / 2;
      const gx = legPos === 'left' ? 14 : (w - legBandW + 8);
      state.series.forEach(s => { drawItem(s, gx, cy); cy += itemH; });
    } else {
      // Horizontal row, centered across the canvas.
      const totalW = legItemW.reduce((a, b) => a + b, 0) + itemGapX * (state.series.length - 1);
      let gx = w / 2 - totalW / 2;
      const cy = legPos === 'top' ? plotTop - legBandH / 2 : h - legBandH / 2;
      state.series.forEach((s, i) => { drawItem(s, gx, cy); gx += legItemW[i] + itemGapX; });
    }
  }

  // Grid + Y axis ticks/labels
  c.font = `400 ${af}px ${FF}`;
  c.textBaseline = 'middle';
  for (let i = 0; i <= TICKS; i++) {
    const frac = i / TICKS;
    const y = plotBottom - frac * plotH;

    if (state.showGrid) {
      c.strokeStyle = '#262626';
      c.lineWidth = 1;
      c.beginPath(); c.moveTo(plotLeft, y); c.lineTo(plotRight, y); c.stroke();
    }

    // Left axis label
    c.fillStyle = '#777';
    c.textAlign = 'right';
    c.fillText(fmtNum(leftMax * frac), plotLeft - 10, y);

    // Right axis label
    if (hasRight) {
      c.fillStyle = '#777';
      c.textAlign = 'left';
      c.fillText(fmtNum(rightMax * frac), plotRight + 10, y);
    }
  }

  // Baseline
  c.strokeStyle = '#3a3a3a';
  c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(plotLeft, plotBottom); c.lineTo(plotRight, plotBottom); c.stroke();

  // X axis category labels (wrapped onto multiple lines, centered per slot)
  c.font = `500 ${af}px ${FF}`;
  c.fillStyle = '#aaa';
  c.textAlign = 'center';
  c.textBaseline = 'top';
  cats.forEach((cat, i) => {
    const cx = plotLeft + slotW * (i + 0.5);
    wrappedLabels[i].forEach((line, li) => {
      c.fillText(line, cx, plotBottom + 10 + li * lineHeight);
    });
  });

  const scaleFor = s => (effAxis(s) === 'right' && state.dualAxis) ? rightMax : leftMax;

  // Bars (grouped side-by-side within each slot). Each bar keeps a constant
  // width, but only the bars that actually have a value are drawn and they're
  // centered under the category tick — so a category missing one of its values
  // still lines its remaining bar(s) up with the label instead of leaving it
  // stuck in an empty lane. `barGap` sets the spacing between adjacent bars.
  const barSeries = state.series.filter(s => s.kind === 'bar');
  const groupW = slotW * state.barWidth;
  const barW = barSeries.length ? groupW / barSeries.length : 0;
  const gap = barW * state.barGap;
  cats.forEach((cat, ci) => {
    const center = plotLeft + slotW * (ci + 0.5);
    const present = barSeries.filter(s => {
      const v = Number(s.values[ci]);
      return isFinite(v) && v > 0;
    });
    if (!present.length) return;
    const subLeft = center - (present.length * barW) / 2;
    present.forEach((s, k) => {
      const v = Number(s.values[ci]);
      const axisMax = scaleFor(s) || 1;
      const bh = Math.min(v / axisMax, 1) * plotH;
      const bx = subLeft + k * barW + gap / 2;
      const bw = Math.max(barW - gap, 1);
      const by = plotBottom - bh;
      c.fillStyle = s.color;
      c.fillRect(bx, by, bw, bh);

      if (s.showLabels)
        drawValueLabel(c, (s.prefix || '') + fmtNum(v) + (s.suffix || ''), bx + bw / 2, by - 3, s.color);
    });
  });

  // Lines (one polyline per line series, gaps on null values)
  const lineSeries = state.series.filter(s => s.kind === 'line');
  lineSeries.forEach(s => {
    const axisMax = scaleFor(s) || 1;
    const pts = cats.map((cat, ci) => {
      const v = Number(s.values[ci]);
      if (!isFinite(v) || s.values[ci] === null || s.values[ci] === '') return null;
      return {
        x: plotLeft + slotW * (ci + 0.5),
        y: plotBottom - Math.min(v / axisMax, 1) * plotH,
        v,
      };
    });

    // Stroke connected segments
    c.strokeStyle = s.color;
    c.lineWidth = state.lineWidth;
    c.lineJoin = 'round';
    c.lineCap = 'round';
    let started = false;
    c.beginPath();
    pts.forEach(p => {
      if (!p) { started = false; return; }
      if (!started) { c.moveTo(p.x, p.y); started = true; }
      else c.lineTo(p.x, p.y);
    });
    c.stroke();

    // Points + value labels
    pts.forEach(p => {
      if (!p) return;
      c.beginPath();
      c.arc(p.x, p.y, state.lineWidth * 1.4, 0, Math.PI * 2);
      c.fillStyle = s.color;
      c.fill();
      if (s.showLabels)
        drawValueLabel(c, (s.prefix || '') + fmtNum(p.v) + (s.suffix || ''),
                       p.x, p.y - state.lineWidth * 1.4 - 3, s.color);
    });
  });
}

function renderPreview() {
  render(ctx, CANVAS_W, CANVAS_H, true);
  persist();
}

// ── Persistence ───────────────────────────────────────────────────────────────
const STORAGE_KEY = 'combo-builder-v1';

// Full, portable snapshot of the chart: data + visual configuration. Shared by
// localStorage persistence and JSON export so the two never drift. Series ids are
// internal-only and omitted (import/restore reassign them).
function getConfig() {
  return {
    title: state.title,
    showTitle: state.showTitle,
    categories: state.categories.slice(),
    series: state.series.map(({ name, color, kind, axis, showLabels, prefix, suffix, values }) =>
      ({ name, color, kind, axis, showLabels, prefix, suffix, values: values.slice() })),
    dualAxis: state.dualAxis,
    showGrid: state.showGrid,
    showLegend: state.showLegend,
    legendPos: state.legendPos,
    aspect: state.aspect,
    bgColor: state.bgColor,
    barWidth: state.barWidth,
    barGap: state.barGap,
    lineWidth: state.lineWidth,
    axisFontSize: state.axisFontSize,
    valueFontSize: state.valueFontSize,
    legendFontSize: state.legendFontSize,
  };
}

function persist() {
  saveState(STORAGE_KEY, getConfig());
}

function restore() {
  const data = loadState(STORAGE_KEY);
  if (!data || !Array.isArray(data.series) || !data.series.length) return false;

  state.title      = data.title      ?? state.title;
  state.showTitle  = data.showTitle  ?? true;
  state.categories = Array.isArray(data.categories) && data.categories.length ? data.categories : state.categories;
  // Migration: older saves used a single global `showValues`; fall back to it per series.
  const legacyLabels = data.showValues === true;
  state.series     = data.series.map((s, i) => ({
    id: s.id ?? (i + 1), name: s.name, color: s.color,
    kind: s.kind === 'line' ? 'line' : 'bar',
    axis: s.axis === 'right' ? 'right' : 'left',
    showLabels: s.showLabels ?? legacyLabels,
    prefix: s.prefix ?? '',
    suffix: s.suffix ?? '',
    values: Array.isArray(s.values) ? s.values : [],
  }));
  state.dualAxis   = data.dualAxis   ?? true;
  state.showGrid   = data.showGrid   ?? true;
  state.showLegend = data.showLegend ?? true;
  state.legendPos  = ['top', 'bottom', 'left', 'right'].includes(data.legendPos) ? data.legendPos : 'top';
  state.aspect     = ASPECTS[data.aspect] ? data.aspect : '16:9';
  state.bgColor    = data.bgColor    ?? state.bgColor;
  state.barWidth   = data.barWidth   ?? state.barWidth;
  state.barGap     = data.barGap     ?? state.barGap;
  state.lineWidth  = data.lineWidth  ?? state.lineWidth;
  state.axisFontSize   = data.axisFontSize   ?? state.axisFontSize;
  state.valueFontSize  = data.valueFontSize  ?? state.valueFontSize;
  state.legendFontSize = data.legendFontSize ?? state.legendFontSize;

  // Keep every series' value array aligned to the category count
  state.series.forEach(s => alignValues(s));
  nextId = Math.max(0, ...state.series.map(s => s.id)) + 1;
  return true;
}

// Pad/trim a series' values to match the number of categories.
function alignValues(s) {
  const n = state.categories.length;
  while (s.values.length < n) s.values.push(null);
  s.values.length = n;
}

// ── UI: Categories ────────────────────────────────────────────────────────────
function renderCategories() {
  const list = document.getElementById('cat-list');
  list.innerHTML = '';
  state.categories.forEach((cat, idx) => {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.style.gridTemplateColumns = '1fr 28px';

    const input = document.createElement('input');
    input.type = 'text';
    input.value = cat;
    input.placeholder = 'Category';
    input.addEventListener('input', e => {
      state.categories[idx] = e.target.value;
      renderMatrix();      // refresh column header (cell focus is elsewhere)
      renderPreview();
    });

    const del = document.createElement('button');
    del.className = 'btn-icon delete';
    del.innerHTML = '×';
    del.title = 'Remove';
    del.addEventListener('click', () => {
      if (state.categories.length <= 1) return;
      state.categories.splice(idx, 1);
      state.series.forEach(s => s.values.splice(idx, 1));
      renderCategories();
      renderMatrix();
      renderPreview();
    });

    row.append(input, del);
    list.appendChild(row);
  });
}

document.getElementById('add-cat').addEventListener('click', () => {
  state.categories.push('Cat ' + (state.categories.length + 1));
  state.series.forEach(s => s.values.push(null));
  renderCategories();
  renderMatrix();
  renderPreview();
});

// ── UI: Series cards ──────────────────────────────────────────────────────────
function makeSegToggle(options, current, disabled, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'seg-toggle' + (disabled ? ' disabled' : '');
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.textContent = opt.label;
    btn.classList.toggle('active', opt.value === current);
    btn.addEventListener('click', () => onChange(opt.value));
    wrap.appendChild(btn);
  });
  return wrap;
}

function renderSeries() {
  const list = document.getElementById('series-list');
  list.innerHTML = '';
  state.series.forEach((s, idx) => {
    const card = document.createElement('div');
    card.className = 'series-card';

    const top = document.createElement('div');
    top.className = 'series-card-top';

    const swatch = colorSwatch(s.color, hex => { s.color = hex; renderMatrix(); renderPreview(); });

    const nameIn = document.createElement('input');
    nameIn.type = 'text';
    nameIn.value = s.name;
    nameIn.placeholder = 'Series name';
    nameIn.addEventListener('input', e => {
      s.name = e.target.value;
      renderMatrix();    // refresh row head (cell focus is elsewhere)
      renderPreview();
    });

    const del = document.createElement('button');
    del.className = 'btn-icon delete';
    del.innerHTML = '×';
    del.title = 'Remove';
    del.addEventListener('click', () => {
      if (state.series.length <= 1) return;
      state.series.splice(idx, 1);
      renderSeries();
      renderMatrix();
      renderPreview();
    });

    top.append(swatch, nameIn, del);

    const controls = document.createElement('div');
    controls.className = 'series-card-controls';

    const kindToggle = makeSegToggle(
      [{ label: 'Bar', value: 'bar' }, { label: 'Line', value: 'line' }],
      s.kind, false,
      v => { s.kind = v; renderSeries(); renderPreview(); }
    );

    const axisToggle = makeSegToggle(
      [{ label: 'Left', value: 'left' }, { label: 'Right', value: 'right' }],
      s.axis, !state.dualAxis,
      v => { s.axis = v; renderSeries(); renderPreview(); }
    );

    controls.append(kindToggle, axisToggle);

    const labelsRow = document.createElement('div');
    labelsRow.className = 'toggle-row';
    const labelsLabel = document.createElement('span');
    labelsLabel.className = 'field-label';
    labelsLabel.textContent = 'Data labels';

    const affix = (value, ph, onChange) => {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'label-affix';
      inp.value = value;
      inp.placeholder = ph;
      inp.maxLength = 4;
      inp.title = ph === 'pre' ? 'Label prefix (e.g. $)' : 'Label suffix (e.g. %)';
      inp.addEventListener('input', e => { onChange(e.target.value); renderPreview(); });
      return inp;
    };

    const right = document.createElement('div');
    right.className = 'labels-right';
    right.append(
      affix(s.prefix, 'pre', v => { s.prefix = v; }),
      affix(s.suffix, 'suf', v => { s.suffix = v; }),
      visToggle(s.showLabels, on => { s.showLabels = on; renderPreview(); }),
    );
    labelsRow.append(labelsLabel, right);

    card.append(top, controls, labelsRow);
    list.appendChild(card);
  });
}

document.getElementById('add-series').addEventListener('click', () => {
  const color = PALETTE[state.series.length % PALETTE.length];
  const s = mkSeries('Series ' + (state.series.length + 1), color, 'bar', 'left', []);
  alignValues(s);
  state.series.push(s);
  renderSeries();
  renderMatrix();
  renderPreview();
});

// ── UI: Value matrix (series rows × category columns) ──────────────────────────
function renderMatrix() {
  const host = document.getElementById('matrix');
  host.innerHTML = '';
  const table = document.createElement('table');
  table.className = 'value-matrix';

  // Header row of category names
  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  hr.appendChild(document.createElement('th'));
  state.categories.forEach(cat => {
    const th = document.createElement('th');
    th.textContent = cat || '—';
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  table.appendChild(thead);

  // One row per series
  const tbody = document.createElement('tbody');
  state.series.forEach(s => {
    const tr = document.createElement('tr');

    const head = document.createElement('th');
    head.className = 'row-head';
    head.title = s.name;
    const chip = document.createElement('span');
    chip.className = 'matrix-chip';
    const dot = document.createElement('span');
    dot.className = 'matrix-dot';
    dot.style.background = s.color;
    chip.append(dot, document.createTextNode(s.name || 'Series'));
    head.appendChild(chip);
    tr.appendChild(head);

    state.categories.forEach((cat, ci) => {
      const td = document.createElement('td');
      const input = document.createElement('input');
      input.type = 'number';
      input.value = (s.values[ci] === null || s.values[ci] === undefined) ? '' : s.values[ci];
      input.addEventListener('input', e => {
        const raw = e.target.value;
        s.values[ci] = raw === '' ? null : parseFloat(raw);
        renderPreview();   // no rebuild — keep cell focus
      });
      td.appendChild(input);
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  host.appendChild(table);
}

// ── Toggles ─────────────────────────────────────────────────────────────────
function syncToggleBtn(id, on) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.textContent = on ? '●' : '○';
  btn.classList.toggle('off', !on);
}

function bindToggle(id, key, after) {
  document.getElementById(id).addEventListener('click', () => {
    state[key] = !state[key];
    syncToggleBtn(id, state[key]);
    if (after) after();
    renderPreview();
  });
}

// Legend position selector (hidden while the legend is off).
function buildLegendPos() {
  const host = document.getElementById('legendPosCtl');
  host.innerHTML = '';
  host.appendChild(makeSegToggle(
    [
      { label: 'Top',    value: 'top' },
      { label: 'Bottom', value: 'bottom' },
      { label: 'Left',   value: 'left' },
      { label: 'Right',  value: 'right' },
    ],
    state.legendPos, false,
    v => { state.legendPos = v; buildLegendPos(); renderPreview(); },
  ));
  document.getElementById('legendPosRow').hidden = !state.showLegend;
}

// Aspect-ratio selector — resizes the canvas to the chosen ratio.
function buildAspect() {
  const host = document.getElementById('aspectCtl');
  host.innerHTML = '';
  host.appendChild(makeSegToggle(
    Object.keys(ASPECTS).map(r => ({ label: r, value: r })),
    state.aspect, false,
    v => { setAspect(v); buildAspect(); },
  ));
}

bindToggle('toggleTitle',  'showTitle');
bindToggle('toggleGrid',   'showGrid');
bindToggle('toggleLegend', 'showLegend', buildLegendPos);
bindToggle('toggleDual',   'dualAxis', renderSeries);  // re-enable/disable axis toggles

document.getElementById('comboTitle').addEventListener('input', e => {
  state.title = e.target.value;
  renderPreview();
});

// ── Display sliders ───────────────────────────────────────────────────────────
function buildSliders() {
  const host = document.getElementById('display-sliders');
  host.innerHTML = '';
  host.append(
    sliderRow('Bar width', {
      min: 0.3, max: 0.95, step: 0.05, value: state.barWidth,
      fmt: v => Math.round(v * 100) + '%',
      onInput: v => { state.barWidth = v; renderPreview(); },
    }),
    sliderRow('Bar gap', {
      min: 0, max: 0.6, step: 0.02, value: state.barGap,
      fmt: v => Math.round(v * 100) + '%',
      onInput: v => { state.barGap = v; renderPreview(); },
    }),
    sliderRow('Line width', {
      min: 1, max: 8, step: 0.5, value: state.lineWidth,
      fmt: v => v, onInput: v => { state.lineWidth = v; renderPreview(); },
    }),
    sliderRow('Axis text size', {
      min: 8, max: 28, step: 1, value: state.axisFontSize,
      fmt: v => v, onInput: v => { state.axisFontSize = v; renderPreview(); },
    }),
    sliderRow('Value text size', {
      min: 8, max: 24, step: 1, value: state.valueFontSize,
      fmt: v => v, onInput: v => { state.valueFontSize = v; renderPreview(); },
    }),
    sliderRow('Legend text size', {
      min: 8, max: 24, step: 1, value: state.legendFontSize,
      fmt: v => v, onInput: v => { state.legendFontSize = v; renderPreview(); },
    }),
  );
}

// ── Background ────────────────────────────────────────────────────────────────
const bgPicker = document.getElementById('bgColorPicker');
const bgHex    = document.getElementById('bgColorHex');
const bgSwatch = document.getElementById('bgSwatch');

function applyBgColor(hex) {
  state.bgColor = hex;
  bgSwatch.style.background = hex;
  bgPicker.value = /^#[0-9a-fA-F]{6}$/.test(hex) ? hex : '#111111';
  bgHex.value = hex;
  renderPreview();
}

bgPicker.addEventListener('input', e => applyBgColor(e.target.value));
bgHex.addEventListener('input', e => {
  if (/^#[0-9a-fA-F]{6}$/.test(e.target.value.trim())) applyBgColor(e.target.value.trim());
});

// ── Export ────────────────────────────────────────────────────────────────────
function exportChart(withBg) {
  exportPNG({
    render, w: CANVAS_W, h: CANVAS_H, withBg,
    filename: withBg ? 'combo-chart.png' : 'combo-chart-transparent.png',
  });
}

// Save the full config (data + colors + sizes + layout) as a JSON file that can
// be re-imported via the Import panel.
function exportJSON() {
  downloadText('combo-chart.json', JSON.stringify(getConfig(), null, 2));
}

// ── Import (paste JSON) ────────────────────────────────────────────────────────
// Accepts a minimal data shape:
//   { "categories": ["Q1", ...], "series": [ { "name": "Revenue", "values": [..] } ] }
// …or a full config as produced by Export JSON, where each series may also carry
// "color"/"kind"/"axis"/"showLabels"/"prefix"/"suffix" and the top level may carry
// visual settings (title, dualAxis, showGrid, legend, aspect, bgColor, sizes…).
// Anything omitted falls back to a sensible default — first series bars, rest lines.
const importPanel = document.getElementById('import-panel');
const importText  = document.getElementById('importText');
const importMsg   = document.getElementById('importMsg');

function showImportMsg(text, ok) {
  importMsg.textContent = text;
  importMsg.classList.toggle('error', !ok);
  importMsg.classList.toggle('ok', !!ok && !!text);
}

// Push the current state into every panel control (inputs, toggles, sliders,
// selectors, background). Shared by import and initial load so they can't drift.
function syncControls() {
  document.getElementById('comboTitle').value = state.title;
  syncToggleBtn('toggleTitle',  state.showTitle);
  syncToggleBtn('toggleGrid',   state.showGrid);
  syncToggleBtn('toggleLegend', state.showLegend);
  syncToggleBtn('toggleDual',   state.dualAxis);
  applyBgColor(state.bgColor);
  buildSliders();
  buildLegendPos();
  buildAspect();
}

const isHex6 = v => /^#[0-9a-fA-F]{6}$/.test(String(v));

function applyImport() {
  let data;
  try {
    data = JSON.parse(importText.value);
  } catch (err) {
    showImportMsg('Invalid JSON: ' + err.message, false);
    return;
  }

  const cats = Array.isArray(data?.categories) ? data.categories.map(String) : null;
  const rawSeries = Array.isArray(data?.series) ? data.series : null;
  if (!cats || !cats.length) {
    showImportMsg('Need a non-empty "categories" array.', false);
    return;
  }
  if (!rawSeries || !rawSeries.length) {
    showImportMsg('Need a non-empty "series" array.', false);
    return;
  }
  if (!rawSeries.every(s => s && Array.isArray(s.values))) {
    showImportMsg('Each series needs a "values" array.', false);
    return;
  }

  nextId = 1;
  state.categories = cats;
  state.series = rawSeries.map((s, i) => {
    const values = s.values.map(v => (v === null || v === '' ? null : Number(v)));
    const series = mkSeries(
      s.name != null ? String(s.name) : 'Series ' + (i + 1),
      isHex6(s.color) ? s.color : PALETTE[i % PALETTE.length],
      s.kind === 'line' || s.kind === 'bar' ? s.kind : (i === 0 ? 'bar' : 'line'),
      s.axis === 'right' ? 'right' : 'left',
      values,
      s.showLabels === true,
      s.prefix != null ? String(s.prefix) : '',
      s.suffix != null ? String(s.suffix) : '',
    );
    alignValues(series);
    return series;
  });

  // Optional visual configuration — applied only when present and valid.
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  if (data.title != null)                  state.title      = String(data.title);
  if (typeof data.showTitle  === 'boolean') state.showTitle  = data.showTitle;
  if (typeof data.dualAxis   === 'boolean') state.dualAxis   = data.dualAxis;
  if (typeof data.showGrid   === 'boolean') state.showGrid   = data.showGrid;
  if (typeof data.showLegend === 'boolean') state.showLegend = data.showLegend;
  if (['top', 'bottom', 'left', 'right'].includes(data.legendPos)) state.legendPos = data.legendPos;
  if (ASPECTS[data.aspect]) state.aspect = data.aspect;
  if (isHex6(data.bgColor)) state.bgColor = data.bgColor;
  if (Number.isFinite(data.barWidth))       state.barWidth       = clamp(data.barWidth, 0.3, 0.95);
  if (Number.isFinite(data.barGap))         state.barGap         = clamp(data.barGap, 0, 0.6);
  if (Number.isFinite(data.lineWidth))      state.lineWidth      = clamp(data.lineWidth, 1, 8);
  if (Number.isFinite(data.axisFontSize))   state.axisFontSize   = clamp(data.axisFontSize, 8, 28);
  if (Number.isFinite(data.valueFontSize))  state.valueFontSize  = clamp(data.valueFontSize, 8, 24);
  if (Number.isFinite(data.legendFontSize)) state.legendFontSize = clamp(data.legendFontSize, 8, 24);

  showImportMsg('Imported ' + state.series.length + ' series × ' + cats.length + ' categories.', true);
  renderCategories();
  renderSeries();
  renderMatrix();
  syncControls();
  setAspect(state.aspect);   // resize canvas to imported ratio, then repaint
}

document.getElementById('toggleImport').addEventListener('click', () => {
  importPanel.hidden = !importPanel.hidden;
  if (!importPanel.hidden) importText.focus();
});
document.getElementById('applyImport').addEventListener('click', applyImport);
document.getElementById('cancelImport').addEventListener('click', () => {
  importPanel.hidden = true;
  showImportMsg('', true);
});

// ── Init ──────────────────────────────────────────────────────────────────────
restore();

renderCategories();
renderSeries();
renderMatrix();
syncControls();
setAspect(state.aspect);   // size the canvas to the restored ratio and paint
</script>
</body>
